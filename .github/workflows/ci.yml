name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Check theme sizes
        run: node scripts/check-theme-sizes.mjs

      - name: Check fallback tiers
        run: node scripts/check-fallback-tiers.mjs

      - name: Check third-party hygiene
        run: node scripts/check-third-party.mjs

      # 无障碍阈值回退肉眼难发现，发布后只能靠新版本修，故进 CI 与发布前置。
      - name: Audit colour contrast
        run: node scripts/audit-contrast.mjs

      - name: Test
        run: pnpm test
