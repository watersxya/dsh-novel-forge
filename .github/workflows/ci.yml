name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Check theme sizes
        run: node scripts/check-theme-sizes.mjs

      # 未定义的 CSS 令牌会让 var() 静默回落到 fallback 或继承值 ——
      # 编译通过、运行时无提示、视觉悄悄跑偏，只能靠静态扫描拦住。
      - name: Check CSS variable closure
        run: node scripts/check-css-vars.mjs

      # 死类名只报告不删（可能是 data-* 驱动或组合基类），永远 exit 0，故可安全设为门禁。
      - name: Check dead CSS classes
        run: node scripts/check-dead-classes.mjs

      - name: Check fallback tiers
        run: node scripts/check-fallback-tiers.mjs

      - name: Check third-party hygiene
        run: node scripts/check-third-party.mjs

      # 无障碍阈值回退肉眼难发现，发布后只能靠新版本修，故进 CI 与发布前置。
      - name: Audit colour contrast
        run: node scripts/audit-contrast.mjs

      - name: Test
        run: pnpm test
