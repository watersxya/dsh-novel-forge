# dsh-novel-forge bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<absolute path to this package>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (docx outline parsing, LLM chapter planning/generation,
# /api/dsh-novel-forge routes, markdown output), and the `dsh.client`
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: novel-forge
      name: '@waterwx/dsh-novel-forge'
